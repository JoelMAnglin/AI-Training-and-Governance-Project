name: Container CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production container
        run: docker build --tag agentforge-academy:test .
      - name: Start container
        run: docker run --detach --name academy --publish 3000:3000 agentforge-academy:test
      - name: Verify health
        run: |
          for attempt in {1..20}; do
            curl --fail http://127.0.0.1:3000/ && exit 0
            sleep 2
          done
          docker logs academy
          exit 1
